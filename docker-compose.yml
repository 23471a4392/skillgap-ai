version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillgap_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skillgap_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: skillgap_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/skillgap_ai?schema=public"
      JWT_SECRET: "skillgap-production-secure-key-2026"
      JWT_EXPIRES_IN: "7d"
      FRONTEND_URL: "http://localhost:80"
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: skillgap_web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
