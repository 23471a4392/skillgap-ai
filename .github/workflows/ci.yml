name: SkillGap AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Schema Migration / Push
        run: npm run db:push

      - name: Run Database Seeder
        run: npm run db:seed

      - name: Build Web Application
        run: npm run build --workspace=@skillgap/web

      - name: Run Deterministic Unit Tests
        run: npm test
